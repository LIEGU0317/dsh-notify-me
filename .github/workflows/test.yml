# Tests only: the plugin has no build step and no dependencies, so this runs
# the suites straight from the checkout on both platforms that ship a desktop
# shell. Ubuntu is the case that would have caught the 1.14.0 Linux raise
# regression; Windows exercises the PowerShell verdict path in
# smoke/host-route-test.mjs.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step on purpose: package.json declares no dependencies, and
      # the suites load only Node built-ins plus the checkout itself.
      - run: npm test
      - run: npm run pack
